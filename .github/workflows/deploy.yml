# ============================================================================
# OPTIONAL deployment automation. The system is fully operable without this
# workflow — the primary update path is SSH + ./scripts/deploy.sh by an
# operator. If you enable it:
#
#   1. Add repository secrets:
#        SSH_PRIVATE_KEY  (deploy key allowed on the server)
#        SERVER_HOST      (e.g. server.example.com)
#        SERVER_USER      (e.g. deploy)
#        SERVER_DIR       (e.g. /opt/fleet-fuel/app)
#   2. Run it manually from the Actions tab (workflow_dispatch) — it never
#      runs automatically on push.
#
# SECRETS LIVE ONLY IN GITHUB ACTIONS SECRETS — never in code, .env files,
# docker-compose files, or this repository's documentation.
# ============================================================================
name: Deploy (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: SSH → server → ./scripts/deploy.sh
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SERVER_DIR }}
            ./scripts/deploy.sh
