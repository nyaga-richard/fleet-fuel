# ============================================================================
# CI — runs on every push/PR. Deploys are manual (see deploy.yml).
# Tests the migration path against a real PostgreSQL 16 service, exactly like
# production, and builds the web frontend.
# ============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — migrations + API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleetfuel
          POSTGRES_USER: fleetfuel
          POSTGRES_PASSWORD: ci-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetfuel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fleetfuel:ci-secret@localhost:5432/fleetfuel
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      SEED_ADMIN_EMAIL: admin@fleetfuel.local
      SEED_ADMIN_PASSWORD: AdminPass123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply migrations (twice — second run must be a no-op)
        run: |
          npm run migrate
          npm run migrate
      - name: Idempotent seed
        run: |
          npm run seed
          npm run seed
      - name: Start API + run end-to-end tests
        run: |
          node src/index.js &
          sleep 3
          npm test

  web:
    name: Web — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: https://api.fuel.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
